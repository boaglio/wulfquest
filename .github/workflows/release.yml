# AGENTS.md §28 — the downloads.
#
# Push a tag like v0.2.0 and this builds the game on Linux and Windows and
# attaches one archive per platform, plus the plain jar, to a GitHub
# Release for that tag. Each archive is a folder with a launcher and its own
# trimmed Java (tools/package.sh), so players need nothing installed.
#
# Run it by hand from the Actions tab ("Run workflow") to get the same
# archives as workflow artifacts, with no release made.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jar:
    name: test and build the jar
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - id: version
        name: version from the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::tag must look like v0.2.0, got $GITHUB_REF_NAME"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: full verify (tests, data validators, CI gates)
        run: mvn -B -q -Pheadless verify
      - name: name the jar
        run: |
          shopt -s nullglob
          jars=()
          for j in target/wulfquest-*.jar; do
            [[ "$(basename "$j")" == original-* ]] || jars+=("$j")
          done
          [[ ${#jars[@]} -eq 1 ]] || { echo "::error::expected one runnable jar, found ${#jars[@]}"; exit 1; }
          mkdir dist
          cp "${jars[0]}" "dist/wulfquest-${{ steps.version.outputs.version }}.jar"
      - uses: actions/upload-artifact@v5
        with:
          name: jar
          path: dist/
          if-no-files-found: error

  app:
    name: app for ${{ matrix.label }}
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  label: Linux x64 }
          - { os: windows-latest, label: Windows x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v5
        with:
          name: jar
          path: dist/
      - name: package
        run: |
          v="${{ needs.jar.outputs.version }}"
          archive=$(tools/package.sh "dist/wulfquest-$v.jar" "$v" | tail -n 1)
          mkdir -p out
          mv "$archive" out/
      - uses: actions/upload-artifact@v5
        with:
          name: app-${{ matrix.os }}
          path: out/
          if-no-files-found: error

  release:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [jar, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist/
          merge-multiple: true
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist/
          # Before 1.0 every release is a pre-release (AGENTS.md §28.1).
          pre=()
          [[ "${{ needs.jar.outputs.version }}" == 0.* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* "${pre[@]}" \
            --title "Wulf Quest ${{ needs.jar.outputs.version }}" \
            --notes-file .github/release-notes.md \
            --generate-notes
